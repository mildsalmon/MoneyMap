[project]
name = "moneymap"
version = "0.1.0"
description = "MoneyMap v1 — 복식부기 가계부 + What-if 미래 자산 시뮬레이터 (백엔드)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.50.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moneymap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
