name: CI
on:
  push:
    branches: [main, 'codex/scenario-*']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: uv run pytest
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
        env:
          MONEYMAP_E2E_BACKEND_PORT: '8882'
          MONEYMAP_E2E_FRONTEND_PORT: '5280'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: frontend/test-results/
  projection-performance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/projection-changed-paths"
          if grep -E '^(backend/moneymap/|backend/tests/benchmark_projection.py|scripts/compare-projection-benchmarks.py|.github/workflows/ci.yml)' "$RUNNER_TEMP/projection-changed-paths"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.paths.outputs.changed == 'true'
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
        if: steps.paths.outputs.changed == 'true'
      - name: Benchmark base and head on the same runner
        if: steps.paths.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach /tmp/moneymap-perf-base "$BASE_SHA"
          cp backend/tests/benchmark_projection.py /tmp/moneymap-perf-base/backend/tests/benchmark_projection.py
          cd /tmp/moneymap-perf-base/backend
          uv run python tests/benchmark_projection.py --warmups 5 --samples 30 --months 12 --output /tmp/projection-base.json
          cd "$GITHUB_WORKSPACE/backend"
          uv run python tests/benchmark_projection.py --warmups 5 --samples 30 --months 12 --output /tmp/projection-head.json
          cd "$GITHUB_WORKSPACE"
          python scripts/compare-projection-benchmarks.py /tmp/projection-base.json /tmp/projection-head.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.paths.outputs.changed == 'true'
        with:
          name: projection-performance
          path: /tmp/projection-*.json
